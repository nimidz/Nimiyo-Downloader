<!DOCTYPE html>
<html lang="en" class="share-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NIMIYO – Quick Save</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="soft-ui.css" />
  <link rel="stylesheet" href="share.css" />
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var urlTheme = params.get("theme");
        var urlDark = params.get("darkMode");
        var urlAccent = params.get("accentColor");

        var s = {};
        try {
          if (window.NimiyoShareBridge && typeof window.NimiyoShareBridge.getAppSettings === 'function') {
            s = JSON.parse(window.NimiyoShareBridge.getAppSettings() || "{}");
          } else if (window.NimidzShareBridge && typeof window.NimidzShareBridge.getAppSettings === 'function') {
            s = JSON.parse(window.NimidzShareBridge.getAppSettings() || "{}");
          } else {
            s = JSON.parse(localStorage.getItem("nimiyo_settings") || "{}");
          }
        } catch(e) {}

        var theme = urlTheme || s.uiTheme || "neobrutalism";
        var isDark = (urlDark === "1" || urlDark === "true") || !!s.darkMode;
        var accent = urlAccent || s.accentColor || localStorage.getItem("nimiyo_accent_color") || "";

        document.documentElement.classList.add("theme-" + theme);
        if (isDark) document.documentElement.classList.add("dark-mode");
        if (accent) {
          document.documentElement.style.setProperty("--accent-color", accent);
        }
        document.addEventListener("DOMContentLoaded", function() {
          document.body.classList.add("theme-" + theme);
          if (isDark) document.body.classList.add("dark-mode");
          if (accent) {
            document.body.style.setProperty("--accent-color", accent);
          }
        });
      } catch(e) {}
    })();
  </script>
</head>
<body class="share-body">
  <!-- Backdrop Blur Click-to-Dismiss -->
  <div id="backdrop" onclick="dismissPanel()"></div>

  <!-- Bottom Sheet Floating Dialog Panel with Nimiyo Neobrutalist Styling -->
  <div id="panel" class="nimiyo-sheet">
    <div class="drag-handle" onclick="dismissPanel()"></div>

    <!-- Header Section -->
    <div class="sheet-header">
      <div class="logo-group">
        <span class="logo">NIMIYO</span>
        <span class="quick-save-badge">QUICK SAVE 🐤</span>
      </div>
      <button class="icon-btn close-btn" onclick="dismissPanel()" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Platform, Title & Change Server Row Card -->
    <div class="media-header-card" id="mediaHeaderCard">
      <div class="media-title-row">
        <span class="tag platform-tag" id="platformBadge">LINK</span>
        <span class="media-title-text" id="mediaTitle">Loading link...</span>
        <button class="server-switch-btn" id="changeServerBtn" onclick="switchServer()" title="Change Server">
          <span class="server-icon">⇄</span>
          <span class="server-name" id="serverLabel">Server</span>
        </button>
      </div>
    </div>

    <!-- Active Download Progress Card (Inline Balloon Progress Bar) -->
    <div id="downloadProgressCard" class="download-progress-card hidden">
      <div class="progress-info-row">
        <div class="progress-title-group">
          <span class="progress-pulse-dot"></span>
          <span class="progress-title" id="progressTitle">Mengunduh...</span>
        </div>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Analyzing Status Section -->
    <div id="statusSection" class="status-section hidden">
      <div class="skeleton-options-wrapper">
        <div class="skeleton-option-item">
          <div class="skeleton-text-group">
            <div class="skeleton-line title"></div>
            <div class="skeleton-line short"></div>
          </div>
          <div class="skeleton-badge"></div>
        </div>
      </div>
      <div class="status-box">
        <div class="loader"></div>
        <div class="status-text" id="statusText">Analyzing link...</div>
        <button id="cancelAnalyzeBtn" class="btn danger-btn cancel-btn-sm" onclick="cancelOngoingAnalysis()">
          <span id="cancelAnalyzeBtnText">CANCEL</span>
        </button>
      </div>
    </div>

    <!-- Error Display Box -->
    <div id="errorSection" class="error-section hidden">
      <div class="error-box" id="errorText">Failed to analyze media link.</div>
      <div class="action-row" style="margin-top: 12px;">
        <button class="btn block-btn" onclick="dismissPanel()" id="errorCloseBtn">Close</button>
        <button class="btn primary-btn block-btn" onclick="retryAnalyze()" id="errorRetryBtn">Retry</button>
      </div>
    </div>

    <!-- Media Download Options List -->
    <div id="downloadListSection" class="result-section hidden">
      <!-- Download Options Header & List -->
      <div class="download-container">
        <h3 id="labelAvailableDownloads">Download Links</h3>
        <div id="downloadList" class="download-links-list">
          <!-- Dynamically rendered download option cards -->
        </div>
      </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="action-row sheet-footer" id="actionRow">
      <button class="btn primary-btn block-btn" id="openInAppBtn" onclick="openFullApp()">
        OPEN APP
      </button>
      <button class="btn block-btn hidden" id="minimizeBtn" onclick="minimizeWindow()">
        MINIMIZE
      </button>
    </div>
  </div>

  <!-- Toast Notification Overlay -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts (100% matching ingredientAPP) -->
  <script type="module" src="js/scrapers/index.js"></script>
  <script type="module" src="share.js"></script>
</body>
</html>
